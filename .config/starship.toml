[nix_shell]
disabled = true
symbol = ""
impure_msg = '[ ](bold sapphire)'
pure_msg = '[ ](bold maroon)'
unknown_msg = '[](bold yellow)'
format = '[$state( \($name\))]($style) '
style = "sky"
heuristic = true

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✗](bold red) "
vimcmd_symbol = "[](bold teal) "
vimcmd_replace_one_symbol = "[❮](bold purple) "
vimcmd_replace_symbol = "[❮](bold flamingo) "
vimcmd_visual_symbol = "[❮](bold maroon) "

[cmd_duration]
min_time = 225
format = "$duration"

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[󱏒 $path]($style)[$read_only]($read_only_style)"
style = "lavender"
disabled = false
home_symbol = "󰜥"


[aws]
format = "[$symbol($profile)(flamingo underline bold italic)]($style)"
# format = "[$symbol($profile) [$region](flamingo underline bold italic)]($style)"
style = "rosewater"
disabled = false
# force_display = true
symbol = "󰸏 "

[aws.region_aliases]
eu-central-1 = "DE"
eu-west-1 = "IR"
eu-west-2 = "UK"
eu-west-3 = "FR"
eu-south-1 = "IT"
eu-south-2 = "ES"
eu-north-1 = "DK"
eu-central-2 = "CH"

[gcloud]
format = "[$symbol($domain) [$project](flamingo underline bold italic)]($style)"
style = "rosewater"
disabled = false
symbol = "󱇶 "

[gcloud.project_aliases]

[custom.firebase]
format = "[$symbol([$output](bold underline red italic))]($style)"
command = 'echo -n $(jq -r ".activeProjects[\"$(pwd)\"]" ~/.config/configstore/firebase-tools.json)'
symbol = "󰥧 "
style = "maroon"
detect_files = ['firebase.json']
ignore_timeout = true

[kubernetes]
format = '[$symbol$context (\($namespace\))]($style)'
disabled = false
symbol = "󱃾 "
style = "teal"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:(?P<region>.*?):cluster/(?P<cluster>.*)"
context_alias = "$cluster"

[sudo]
format = '[$symbol]($style)'
disabled = true

[time]
disabled = false
format = "[$time]($style)"

[hostname]
ssh_only = true
ssh_symbol = " "
trim_at = ''
format = '[$hostname $ssh_symbol]($style)'
style = "italic bold red bg:black"

[username]
style_user = 'pink bold bg:black'
style_root = 'red bold blink italic bg:black'
format = '[$user@]($style)'
disabled = false
show_always = false
detect_env_vars = ['SSH_TTY', 'SSH_CLIENT']

[[battery.display]]
threshold = 100
style = 'green'

[[battery.display]]
threshold = 80
style = 'teal'

[[battery.display]]
threshold = 60
style = 'maroon'

[[battery.display]]
threshold = 40
style = 'pink'

[[battery.display]]
threshold = 20
style = 'red'

[jobs]
symbol = " "

[custom.vpn]
command = "true"
# utun100 = netbird on macOS; wt0 = netbird on Linux
when = "ifconfig 2>/dev/null | grep -q utun100 || ip link 2>/dev/null | grep -q wt0"
format = "[󱠾 ](rosewater)"

[custom.terrafrom_env]
detect_extensions = ['tf', 'tfplan', 'tfstate']
detect_files = ['root.hcl']
format = " $output"
command = "echo \"$TF_VAR_environment\""

[custom.rss]
command = "nom --config-path $XDG_CONFIG_HOME/nom/ unread"
when = "command -v nom >/dev/null 2>&1"
symbol = " "
format = "[$symbol$output]($style)"
style = "bold peach"

[fill]
symbol = '─'
style = 'dimmed black'

[custom.profile]
when = true
format = "$output"
command = "echo \"$__PROFILE\""
