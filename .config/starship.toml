"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
format = """
(${username}${hostname} [|](dimmed) )\
$directory\
${custom.sep}\
$kubernetes\
${custom.sep}\
$gcloud\
$aws\
${custom.sep}\
${custom.terrafrom_env}\
${custom.sep}\
(${custom.firebase} [|](dimmed) )\
([  ](subtext0)$docker_context$bun$golang$helm$nodejs$python$rust$gleam$terraform[|](dimmed) )\
${custom.git_provider}\
$git_branch\
$git_commit\
$git_status\
$git_metrics\
$fill \
${custom.profile} \
$fill \
($status [|](dimmed) )($cmd_duration [|](dimmed) )$jobs$battery${custom.vpn} ${custom.rss}$sudo $time
$nix_shell$character
"""
# right_format = "$status $cmd_duration $time"
# add_newline = true

[profiles]
short = """
$character $status($status [|](dimmed) )($cmd_duration [|](dimmed) )$time
"""

[docker_context]
disabled = false
format = "[$symbol]($style)"

[custom.sep]
format = '[ | ]($style)'
when = true
style = "dimmed"

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
symbol = "󰊢 "
style = "peach"

[git_commit]
only_detached = false
tag_disabled = false
commit_hash_length = 8

[custom.git_provider]
shell = "sh"
command = """
if git remote -v | grep -q github; then
  echo " "
elif git remote -v | grep -qE "(gitlab|on.ag)"; then
  echo " "
else
  echo "󰊢 "
fi
"""
format = '[$output]($style) '
when = true
style = "peach"
require_repo = true
disabled = false
ignore_timeout = true

[git_status]
format = '([$all_status$ahead_behind]($style)) '
style = "peach"

[git_metrics]
disabled = false

[bun]
format = "[$symbol]($style)"

[golang]
format = '[$symbol]($style)'
symbol = " "

[helm]
format = '[$symbol]($style)'
symbol = "󰻈 "
[nodejs]
format = '[$symbol]($style)'
symbol = "󰎙 "
[python]
format = '[$symbol]($style)'

[terraform]
symbol = " "
format = '[$symbol]($style)'
[rust]
format = '[$symbol]($style)'

[gleam]
format = '[$symbol]($style)'

[status]
disabled = false
format = '[$status]($style)'

