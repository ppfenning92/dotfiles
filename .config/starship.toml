[nix_shell]
disabled = true
symbol = ""
impure_msg = '[ ](bold azure)'
pure_msg = '[ ](bold rose)'
unknown_msg = '[](bold yellow)'
format = '[$state( \($name\))]($style) '
style = "cyan"
heuristic = true

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✗](bold red) "
vimcmd_symbol = "[](bold teal) "
vimcmd_replace_one_symbol = "[❮](bold purple) "
vimcmd_replace_symbol = "[❮](bold salmon) "
vimcmd_visual_symbol = "[❮](bold rose) "

[cmd_duration]
min_time = 225
format = "$duration"

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[󱏒 $path]($style)[$read_only]($read_only_style)"
style = "indigo"
disabled = false
home_symbol = "󰜥"


[aws]
format = "([󰸏 $profile]($style))"
# format = "[$symbol($profile) [$region](salmon underline bold italic)]($style)"
style = "cream"
disabled = false
# force_display = true
symbol = "󰸏 "

[aws.region_aliases]
eu-central-1 = "DE"
eu-west-1 = "IR"
eu-west-2 = "UK"
eu-west-3 = "FR"
eu-south-1 = "IT"
eu-south-2 = "ES"
eu-north-1 = "DK"
eu-central-2 = "CH"

[kubernetes]
format = '[$symbol$context( \($namespace\))]($style)'
disabled = false
symbol = "󱃾 "
style = "teal"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:(?P<region>.*?):cluster/(?P<cluster>.*)"
context_alias = "$cluster"

[sudo]
format = '[$symbol]($style)'
disabled = true

[time]
disabled = false
format = "[$time]($style)"

[hostname]
ssh_only = true
ssh_symbol = " "
trim_at = ''
format = '[$hostname $ssh_symbol]($style)'
style = "italic bold red bg:black"

[username]
style_user = 'pink bold bg:black'
style_root = 'red bold blink italic bg:black'
format = '[$user@]($style)'
disabled = false
show_always = false
detect_env_vars = ['SSH_TTY', 'SSH_CLIENT']

[[battery.display]]
threshold = 100
style = 'green'

[[battery.display]]
threshold = 80
style = 'teal'

[[battery.display]]
threshold = 60
style = 'rose'

[[battery.display]]
threshold = 40
style = 'pink'

[[battery.display]]
threshold = 20
style = 'red'

[jobs]
symbol = " "

[custom.vpn]
command = "true"
# utun100 = netbird on macOS; wt0 = netbird on Linux
when = "ifconfig 2>/dev/null | grep -q utun100 || ip link 2>/dev/null | grep -q wt0"
format = "[󱠾 ](cream)"

[custom.terrafrom_env]
detect_extensions = ['tf', 'tfplan', 'tfstate']
detect_files = ['root.hcl']
format = "( $output)"
command = '[ "$__PROFILE" = ottonova ] && echo "$TF_VAR_environment" || true'

[custom.rss]
command = "nom --config-path $XDG_CONFIG_HOME/nom/ unread"
when = "command -v nom >/dev/null 2>&1"
symbol = " "
format = "[$symbol$output]($style)"
style = "bold orange"

[fill]
symbol = '─'
style = 'dimmed black'

[custom.profile]
when = true
format = "$output"
command = "echo \"$__PROFILE\""
